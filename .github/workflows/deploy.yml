name: CI

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Check Python
        run: |
          & "C:/Program Files/Python310/python.exe" --version
        shell: powershell

      - name: Install dependencies
        run: |
          & "C:/Program Files/Python310/python.exe" -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            & "C:/Program Files/Python310/python.exe" -m pip install -r requirements.txt
          }
          & "C:/Program Files/Python310/python.exe" -m pip install pytest
        shell: powershell

      - name: Run tests
        continue-on-error: true
        run: |
          & "C:/Program Files/Python310/python.exe" -m pytest -q
        shell: powershell
