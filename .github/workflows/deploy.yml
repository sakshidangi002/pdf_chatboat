name: CI

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64]   # MUST match your runner labels

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use system Python
        run: python --version
        shell: powershell

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        shell: powershell

      - name: Lint
        run: |
          if (Get-Command flake8 -ErrorAction SilentlyContinue) { flake8 }
        shell: powershell

      - name: Run tests
        run: |
          pytest -q
        shell: powershell
